# Neo4j for Mimir — graph + native vector index in one store. Local only.
services:
  neo4j:
    image: neo4j:5.26-community
    container_name: mimir-graph
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474" # HTTP / Browser
      - "127.0.0.1:7687:7687" # Bolt
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env.local}"
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1G"
      NEO4J_server_memory_pagecache_size: "512m"
    volumes:
      - mimir-data:/data
      - mimir-logs:/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u neo4j -p '${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env.local}' 'RETURN 1' || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 12
      start_period: 40s

volumes:
  mimir-data:
  mimir-logs:
